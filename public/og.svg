<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Fondo carbón -->
  <rect width="1200" height="630" fill="#0E0E0E"/>

  <!-- Grain sutil: patrón de ruido con filtro SVG -->
  <filter id="grain" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
    <feComposite in="blend" in2="SourceGraphic" operator="in"/>
  </filter>
  <rect width="1200" height="630" fill="transparent" filter="url(#grain)" opacity="0.04"/>

  <!-- Línea separadora superior — detalle editorial -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Kicker — mono uppercase, crema apagado/taupe -->
  <text
    x="80"
    y="118"
    font-family="'Archivo', 'IBM Plex Mono', 'Courier New', monospace"
    font-weight="400"
    font-size="13"
    letter-spacing="3"
    fill="#8A857B"
    text-rendering="geometricPrecision"
  >SCUART — DESIGN &amp; TECHNOLOGY STUDIO</text>

  <!-- Headline principal: "DESIGN" -->
  <text
    x="80"
    y="330"
    font-family="'Archivo', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="148"
    letter-spacing="-4"
    fill="#E8E2D6"
    text-rendering="geometricPrecision"
  >DESIGN</text>

  <!-- Headline: "+" en rojo — acento único -->
  <text
    x="682"
    y="330"
    font-family="'Archivo', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="148"
    letter-spacing="-4"
    fill="#D70321"
    text-rendering="geometricPrecision"
  >+</text>

  <!-- Headline: "TECHNOLOGY" — segunda línea -->
  <text
    x="80"
    y="470"
    font-family="'Archivo', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="148"
    letter-spacing="-4"
    fill="#E8E2D6"
    text-rendering="geometricPrecision"
  >TECHNOLOGY</text>

  <!-- Subcopy — taupe, liviano -->
  <text
    x="80"
    y="550"
    font-family="'Archivo', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="400"
    font-size="18"
    letter-spacing="0.5"
    fill="#8A857B"
    text-rendering="geometricPrecision"
  >Premium websites, platforms and digital systems for ambitious businesses.</text>

  <!-- Línea separadora inferior -->
  <line x1="80" y1="580" x2="1120" y2="580" stroke="#2A2A2A" stroke-width="1"/>

  <!-- URL del sitio — detalle de marca, esquina inferior derecha -->
  <text
    x="1120"
    y="610"
    font-family="'Archivo', 'IBM Plex Mono', 'Courier New', monospace"
    font-weight="400"
    font-size="12"
    letter-spacing="2"
    fill="#4A4540"
    text-anchor="end"
    text-rendering="geometricPrecision"
  >scuart.com</text>
</svg>
