<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Demo Contacto — SCUART</title>
<style>
  @font-face {
    font-family: "PP Editorial New";
    src: url("/fonts/ppeditorialnew-light.woff2") format("woff2"),
         url("/fonts/ppeditorialnew-light.woff") format("woff");
    font-weight: 300 400;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg: #f4f2ec;
    --ink: #14130f;
    --ink-62: rgba(20, 19, 15, 0.62);
    --ink-42: rgba(20, 19, 15, 0.42);
    --hairline: rgba(20, 19, 15, 0.16);
    --brand: #c6f24e;
    --font-display: "PP Editorial New", serif;
    --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
    --margin: clamp(1.25rem, 5vw, 7rem);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .contact {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(4rem, 12vh, 9rem) var(--margin);
  }

  .contact__kicker {
    font-size: 0.8125rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-42);
    margin-bottom: clamp(1.5rem, 4vh, 3rem);
  }

  /* Statement conversacional */
  .contact__statement {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(2rem, 5vw, 4.5rem);
    line-height: 1.05;
    letter-spacing: -0.025em;
    max-width: 20ch;
    margin-bottom: clamp(2.5rem, 7vh, 5rem);
  }

  /* EL EMAIL — protagonista gigante */
  .contact__email {
    display: inline-block;
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(2.25rem, 8vw, 7rem);
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--ink);
    text-decoration: none;
    /* underline animado por background-size (sin JS) */
    background-image: linear-gradient(var(--ink), var(--ink));
    background-repeat: no-repeat;
    background-position: 0 100%;
    background-size: 0% 1.5px;
    transition: background-size 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    padding-bottom: 0.08em;
  }
  .contact__email:hover,
  .contact__email:focus-visible {
    background-size: 100% 1.5px;
  }

  /* Fila inferior: opciones claras + respuesta */
  .contact__foot {
    margin-top: clamp(3rem, 8vh, 6rem);
    padding-top: clamp(1.5rem, 4vh, 2.5rem);
    border-top: 1px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: var(--margin);
    flex-wrap: wrap;
  }
  .contact__options {
    display: flex;
    gap: clamp(1.25rem, 3vw, 2.5rem);
    align-items: baseline;
  }
  .contact__link {
    font-size: 0.8125rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-62);
    text-decoration: none;
    display: inline-flex;
    align-items: baseline;
    gap: 0.4em;
    transition: color 0.28s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  .contact__link:hover { color: var(--ink); }
  .contact__link .arrow { color: var(--brand); }
  .contact__note {
    font-size: 0.8125rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-42);
  }

  @media (max-width: 640px) {
    .contact__foot { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
    .contact__email { font-size: clamp(1.75rem, 11vw, 3rem); }
  }
</style>
</head>
<body>
  <section class="contact">
    <p class="contact__kicker">Contacto</p>

    <h2 class="contact__statement">Contanos qué estás construyendo.</h2>

    <a class="contact__email" href="mailto:info@scuart.com">info@scuart.com</a>

    <div class="contact__foot">
      <div class="contact__options">
        <a class="contact__link" href="mailto:info@scuart.com">
          Empezar un proyecto <span class="arrow">→</span>
        </a>
        <a class="contact__link" href="#">
          Agendar una llamada <span class="arrow">→</span>
        </a>
      </div>
      <p class="contact__note">Respondemos en 24 horas</p>
    </div>
  </section>
</body>
</html>
