<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Demo Hero — SCUART</title>
<style>
  @font-face {
    font-family: "PP Editorial New";
    src: url("/fonts/ppeditorialnew-light.woff2") format("woff2"),
         url("/fonts/ppeditorialnew-light.woff") format("woff");
    font-weight: 300 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --bg: #f4f2ec;
    --ink: #14130f;
    --ink-62: rgba(20, 19, 15, 0.62);
    --ink-42: rgba(20, 19, 15, 0.42);
    --hairline: rgba(20, 19, 15, 0.16);
    --brand: #c6f24e;
    --font-display: "PP Editorial New", serif;
    --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
    --margin: clamp(1.25rem, 5vw, 7rem);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100svh;
  }

  .hero {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: var(--margin);
    position: relative;
  }

  /* ── NAV (arriba) ── */
  .hero__nav {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: clamp(2rem, 6vh, 5rem);
    border-bottom: 1px solid var(--hairline);
  }
  .hero__wordmark {
    font-family: var(--font-display);
    font-size: clamp(1.1rem, 1.4vw, 1.4rem);
    letter-spacing: -0.01em;
  }
  .hero__wordmark sup { font-size: 0.5em; vertical-align: super; }
  .hero__menu {
    display: flex;
    gap: clamp(1rem, 2.5vw, 2.5rem);
    font-size: 0.8125rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-62);
  }
  .hero__menu span:last-child { color: var(--ink-42); }

  /* ── TITULAR (domina, alineado izquierda, asimétrico) ── */
  .hero__main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-block: clamp(2rem, 8vh, 6rem);
  }
  .hero__headline {
    font-family: var(--font-display);
    font-weight: 300;
    font-size: clamp(2.5rem, 6.2vw, 6.75rem);
    line-height: 1.02;
    letter-spacing: -0.03em;
    max-width: 20ch;
  }
  /* recurso de énfasis = itálica de la propia fuente (lo que casi nadie explota) */
  .hero__headline em {
    font-style: italic;
    font-weight: 300;
  }

  /* ── PIE: descriptor izquierda + dato derecha ── */
  .hero__foot {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: var(--margin);
    padding-top: clamp(1.5rem, 4vh, 3rem);
    border-top: 1px solid var(--hairline);
  }
  .hero__descriptor {
    font-size: clamp(0.95rem, 1.1vw, 1.0625rem);
    line-height: 1.5;
    color: var(--ink-62);
    max-width: 46ch;
  }
  .hero__meta {
    text-align: right;
    font-size: 0.8125rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-42);
    line-height: 1.6;
    white-space: nowrap;
  }
  .hero__star { color: var(--brand); }

  @media (max-width: 640px) {
    .hero__menu { gap: 0.9rem; font-size: 0.7rem; }
    .hero__foot { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
    .hero__meta { text-align: left; }
    .hero__headline { max-width: 100%; }
  }
</style>
</head>
<body>
  <section class="hero">
    <nav class="hero__nav">
      <div class="hero__wordmark">SCUART<sup>®</sup></div>
      <div class="hero__menu">
        <span>Trabajo</span>
        <span>Estudio</span>
        <span>Contacto</span>
        <span>EN&nbsp;·&nbsp;ES</span>
      </div>
    </nav>

    <div class="hero__main">
      <h1 class="hero__headline">
        Somos un estudio de diseño web <em>independiente.</em>
      </h1>
    </div>

    <div class="hero__foot">
      <p class="hero__descriptor">
        Ideas claras, criterio fuerte, y obsesión por el detalle. Diseñamos y
        construimos sitios web pensados para vender — no solo para verse bien.
      </p>
      <p class="hero__meta">
        Nueva York <span class="hero__star">*</span> LATAM<br />
        EN / ES
      </p>
    </div>
  </section>
</body>
</html>
